name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Type check and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Astro supports even-numbered releases only.
          node-version: 24
          cache: npm

      # npm ci refuses to run when the lockfile's optional-dependency subtree
      # doesn't match the current platform (e.g. sharp/resvg's emnapi/WASM
      # fallback packages resolve differently on Linux vs. macOS), so this
      # uses npm install instead of requiring the lockfile to have been
      # generated on the same OS as CI.
      - run: npm install

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
